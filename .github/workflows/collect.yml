name: Collect private drafts

on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-drafts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect and filter RSS
        env:
          API_URL: ${{ secrets.API_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          curl -i -X POST \
            "$API_URL/api/ingest/seen" \
            -H 'Content-Type: application/json' \
            --data '{"urls":[]}'
          python3 scripts/collect.py