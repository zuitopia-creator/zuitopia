<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Zuitopia — Admin</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../style.css"><script type="module" src="./admin.js"></script></head><body class="admin-body">
<header class="admin-header"><a class="brand" href="../"><span class="brand-mark">z.</span>zuitopia <span class="eyebrow">ADMIN</span></a><div class="admin-header-actions"><a href="../">Xem feed</a><button id="logout" class="button secondary" hidden>Đăng xuất</button></div></header>
<section id="login-view" class="login-card"><span class="eyebrow">GÓC BIÊN TẬP</span><h1>Chào bà, admin.</h1><p>Đăng nhập để chọn những điều hay cho feed.</p><form id="login-form"><label class="field">Mật khẩu<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="button" type="submit">Đăng nhập</button><p id="login-error" class="error" role="alert"></p></form></section>
<main id="workspace" class="admin-workspace" hidden><div class="admin-title"><div><span class="eyebrow">BIÊN TẬP VIỆT · ANH</span><h1>Chọn điều đáng đọc.</h1></div><button class="button secondary" id="refresh">Làm mới</button></div><p id="message" class="admin-message" role="status" hidden></p><nav id="status-tabs" class="admin-tabs" aria-label="Trạng thái bài"></nav><div class="admin-grid"><section><div id="queue" class="queue"></div><button id="queue-more" class="button secondary more" hidden>Xem thêm</button></section><section id="editor" class="editor"><p class="empty">Chọn một bài để xem và chỉnh sửa.</p></section></div></main>
</body></html>
